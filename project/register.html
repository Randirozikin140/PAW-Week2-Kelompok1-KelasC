<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - SakuUsaha</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="home">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="logo" href="index.html" aria-label="SakuUsaha, ke beranda">
          <span class="logo__mark" aria-hidden="true">S</span>
          <span class="logo__text">SakuUsaha</span>
        </a>
        <nav class="site-nav" aria-label="Navigasi utama">
          <ul class="site-nav__list">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="landing-page.html">Review jurnal</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container container--narrow">
        <h1 class="section__title">Buat akun SakuUsaha</h1>
        <p class="section__intro">
          Isi data di bawah untuk mendaftar. Semua kolom wajib diisi.
        </p>

        <form class="form" id="form-register" novalidate>
          <div class="form__group">
            <label for="nama">Nama lengkap *</label>
            <input
              type="text"
              id="nama"
              name="nama"
              autocomplete="name"
              required
            />
          </div>
          <div class="form__group">
            <label for="email">Email *</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
            />
          </div>
          <div class="form__group">
            <label for="password">Password * (minimal 6 karakter)</label>
            <input
              type="password"
              id="password"
              name="password"
              minlength="6"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="form__group">
            <label for="role">Daftar sebagai *</label>
            <select id="role" name="role" required>
              <option value="mahasiswa">Mahasiswa</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <p
            class="form__message"
            id="pesan"
            role="status"
            aria-live="polite"
            hidden
          ></p>
          <button class="btn btn--primary btn--block" type="submit">
            Daftar
          </button>
        </form>
        <p class="form__alt">
          Sudah punya akun? <a href="login.html">Masuk di sini</a>.
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>
          &copy; 2026 SakuUsaha. Kelompok kelas C, Pemrograman Aplikasi Web.
        </p>
      </div>
    </footer>
    <script src="js/auth.js"></script>
  </body>
</html>
